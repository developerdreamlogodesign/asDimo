name: AsDimo CI/CD

on:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: asDimoWebApp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: asDimoBackend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

  deploy:
    needs: [frontend, backend]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }}
          script: |
            cd ~/public_html/dev/asDimo

            git pull origin main

            cd asDimoBackend
            npm install

            npx pm2 restart asdimo-api || npx pm2 start server.js --name asdimo-api

            script: |
              cd ~/public_html/dev/asDimo

              git pull origin main

              cd asDimoWebApp
              npm ci || npm install
              npm run build

              cd ../asDimoBackend
              npm ci || npm install

              npx pm2 restart asdimo-api || npx pm2 start server.js --name asdimo-api